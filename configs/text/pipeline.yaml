# 文本流程开关（Spec 第 14.9 节 v1.30）。修改后无需改代码；每条标注与复核统计都记录生效的设置。
#
# screening：哪些段落交给大模型判断
#   glossary —— 术语表预筛（POC 默认）：只送命中术语表的段落，约占 5%，成本低；未命中的视为不涉及风险，可能漏检
#   full     —— 全文（正式业务时启用）：送全部段落（过短的除外），基本不漏，调用量约为预筛的 20 倍；
#               切换后运行 `python -m factopia.text understand --dataset fr --refresh`，已有标注保留，只补未判断的段落
screening: glossary
full_min_chars: 40            # 全文模式下，短于该长度的段落（页眉、表格碎片）不送

# 复核队列分组（业务文档：低置信度翻译必须人工复核；其余触发复核的段落按风险排序 + 抽样）
review:
  sample_size: 100            # 抽样质检：从大模型判断过的段落中随机抽取（不论是否触发复核），用于估计准确率
  sample_unscreened: 30       # 漏检抽样：从术语表未命中、没送大模型的段落中随机抽取，用于估计漏检率（仅 glossary 模式）
  sample_seed: 20261013       # 固定种子：同一批数据每次抽到相同的段落
  high_impact_top: 50         # 高影响：判断一旦相反就会翻转该篇"风险变化"方向的段落，按影响大小最多取前 N 段
  must_flags: [low_translation_confidence]   # 必须复核：未复核时阻止使用该数据集的研究提交审批

# 术语表扩充（AI 从未命中的段落里找漏掉的风险说法，人工批准后生效）
glossary_suggest:
  sample: 300                 # 每次抽取的未命中段落数

# 数据清理（不调用大模型，只改打分口径；修改后重算信号 python -m factopia.text signal --dataset fr）
# 通知类公告："报告已发布 / mise à disposition"一类的短文件。风险语气接近 0，混入同公司报告系列会制造假的
# "变乐观 / 变悲观"。排除后不参与系列比较，页面上仍列出并标明原因。模拟数据集不适用（生成的公告本来就短）。
series_filter:
  datasets: [fr]
  min_paragraphs: 10            # 少于该段数：通知或 PDF 抽不出文字
  notice_max_paragraphs: 20     # 标题像通知、且少于该段数
  notice_title_pattern: "mise [àa] disposition|availability|available|disponibilit|publication (of|du|de)|publie son|publishes its|terms of availability|modalit[ée]s de mise|filed (today|on)|d[ée]p[ôo]t du"

# 表格行：以数字为主的段落（财务报表里的一行）不是管理层的风险表述。不送大模型、不计入风险语气（分子分母都不计）
table_rows:
  enabled: true
  min_tokens: 4
  numeric_share: 0.4            # 数字类词占比达到该值视为表格行
