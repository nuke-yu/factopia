# 研究迭代 Agent（WF-02）策略；Spec 第 18.10、18.12 节。
# P0 只实现 new_version / stop；其余工具列在白名单里，P1 接入后再生效（available_tools 会按实现过滤）。
max_rounds: 5
budget_usd: 2.0
no_improve_patience: 2
human_gate: costly_actions        # all | costly_actions | none
tools:
  - new_version
  - run_rdagent
  - run_text
  - validate
  - diagnose
  - redundancy
  - complement
  - rule_precheck
  - write_idea
  - stop
costly_tools:
  - new_version
  - run_rdagent
  - run_text
prompts:
  critic: iteration-critic-v1
  planner: iteration-planner-v1
  evaluator: iteration-evaluator-v1
