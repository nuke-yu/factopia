# 地区视角（BR-45；Spec 第 14.20 节）。演示用，不是登录鉴权：页面顶部切换地区角色，后端按本策略过滤数据与信号。
# 正式部署须接入身份认证（SSO）后按用户所属地区授权；本文件的结构可直接沿用。
version: access-v2026.10.0
status: 演示用，不是登录鉴权
owner: 数据负责人 / 各地区合规（待指定）
default: hq                     # 请求未带地区角色时（命令行、旧客户端）按总部处理
roles:
  hq:
    name: 总部（全部地区）
    markets: [hk, uk, fr]
    cross_region: true
  hk:
    name: 香港团队
    markets: [hk]
    cross_region: false
  uk:
    name: 伦敦团队
    markets: [uk]
    cross_region: false
  fr:
    name: 巴黎团队
    markets: [fr]
    cross_region: false
# 地区角色可见的范围
scope:
  - 行情、诊断、运行结果：只看本地区市场的运行
  - 公告文本（情报台）与复核队列：只看本地区市场的数据集
  - 证券主数据与公司行动：只看本地区市场的证券
  - 信号目录与监控：只看本地区市场的版本；暂停 / 恢复 / 停用只能操作本地区版本
  - 审批：只看涉及本地区市场的提交；其他地区的结果打码
  - 因子库与知识检索：获批信号只显示本地区市场；外部公告只检索本地区数据集
  - 跨地区内容（多市场组合、研究报告、审计证据包）：只对总部开放
