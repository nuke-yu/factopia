# 组合层结构化参数（第 0.4 节第 6 步；PORT-01、02）：组合构建直接读取，每个约束在组合结果中注明来源条款
portfolio:
  benchmark_weights: {hk: 0.4, uk: 0.3, fr: 0.3}   # 复合基准：恒生指数 40% + 富时 100 30% + CAC 40 30%（换算为基础币种）
  max_tracking_error: 0.06                          # 对应 risk_budget（年化）
  market_limits: {hk: 0.5, uk: 0.4, fr: 0.4}
  max_turnover: 0.3                                 # 单次调仓（单边）
  holdings_per_market: 20
  rebalance: monthly
free_text:
  - 印花税等交易成本较高，避免需要每日调仓的策略
