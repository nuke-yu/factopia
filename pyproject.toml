[project]
name = "factopia"
version = "0.0.1"
description = "AI 驱动的跨境量化股票策略研究平台（最小 POC）"
requires-python = ">=3.12,<3.13"
dependencies = [
    "yfinance",
    "exchange-calendars",
    "pandas",
    "pyarrow",
    # PyPI 上的 pyqlib 没有 Linux ARM 安装包，改为从源码编译；
    # 源码快照在仓库 qlibs/（与 RD-Agent 官方镜像固定同一提交 2fb9380），保证两边 Qlib 一致
    "pyqlib",
    "skfolio",
    # Qlib 的实验记录依赖 MLflow 文件存储，3.13 起默认关闭（见 Qlib 主分支 pyproject 注释）
    "mlflow<3.13",
    # 公告 PDF 提取文本（factopia.text）
    "pypdf",
    "pyyaml",
    # 数据库存储（factopia.db / factopia.repo / tools/migrate_files.py）
    # search_path 与 statement_timeout 由 DSN 的 options 指定，不用 ORM
    "psycopg[binary,pool]>=3.2",
]

[project.optional-dependencies]
# 模拟盘长桥通道（factopia.paper.broker）：影子撮合模式不需要该依赖
paper = ["longport"]

[tool.uv.sources]
pyqlib = { path = "qlibs", editable = true }

[tool.uv]
package = false
