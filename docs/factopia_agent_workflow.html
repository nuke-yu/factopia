<svg viewBox="0 0 680 700" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Factopia AI Agent 与工作流全景</title>
  <desc>从线索到监控的全链路：AI 驱动步骤（蓝）、规则统计步骤（灰）、人工节点（琥珀），以及监控预警回流闭环。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="var(--font-sans, sans-serif)">
    <rect x="40" y="10" width="12" height="12" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text class="ts" x="58" y="16" font-size="12" fill="#444441" dominant-baseline="central">AI 驱动</text>
    <rect x="120" y="10" width="12" height="12" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text class="ts" x="138" y="16" font-size="12" fill="#444441" dominant-baseline="central">规则 / 统计</text>
    <rect x="212" y="10" width="12" height="12" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text class="ts" x="230" y="16" font-size="12" fill="#444441" dominant-baseline="central">人工节点</text>

    <rect x="40" y="36" width="600" height="60" rx="12" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
    <text class="th" x="60" y="52" font-size="13" fill="#444441">线索池 ideas（9 个渠道）</text>
    <rect x="60" y="60" width="170" height="26" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
    <text class="ts" x="145" y="73" font-size="11" fill="#444441" text-anchor="middle" dominant-baseline="central">人工提交：假设/经验/反馈</text>
    <rect x="246" y="60" width="180" height="26" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text class="ts" x="336" y="73" font-size="11" fill="#0C447C" text-anchor="middle" dominant-baseline="central">论文抽取：因子+页码引用</text>
    <rect x="442" y="60" width="180" height="26" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
    <text class="ts" x="532" y="73" font-size="11" fill="#444441" text-anchor="middle" dominant-baseline="central">平台自动回流（监控/审批）</text>

    <path d="M340 96 L340 120" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="80" y="122" width="230" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text class="th" x="195" y="140" font-size="13" fill="#0C447C" text-anchor="middle" dominant-baseline="central">AI 调研 Agent（brief）</text>
    <text class="ts" x="195" y="158" font-size="11" fill="#185FA5" text-anchor="middle" dominant-baseline="central">PLAN→ACT 循环，预算 $0.5 / 3 轮</text>
    <rect x="370" y="122" width="230" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text class="th" x="485" y="140" font-size="13" fill="#0C447C" text-anchor="middle" dominant-baseline="central">公告深挖 Agent（dig）</text>
    <text class="ts" x="485" y="158" font-size="11" fill="#185FA5" text-anchor="middle" dominant-baseline="central">检索-提取-决策，预算 $1.5 / 4 轮</text>

    <path d="M195 178 L195 204" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M485 178 L485 204" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="80" y="206" width="230" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text class="th" x="195" y="224" font-size="13" fill="#0C447C" text-anchor="middle" dominant-baseline="central">AI 起草研究规格（draft）</text>
    <text class="ts" x="195" y="242" font-size="11" fill="#185FA5" text-anchor="middle" dominant-baseline="central">证据包→JSON 规格→硬校验重试</text>
    <rect x="370" y="206" width="230" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text class="th" x="485" y="224" font-size="13" fill="#0C447C" text-anchor="middle" dominant-baseline="central">AI 起点因子构想（seeds）</text>
    <text class="ts" x="485" y="242" font-size="11" fill="#185FA5" text-anchor="middle" dominant-baseline="central">因子库变体/组合，引用校验</text>

    <path d="M195 262 L195 288" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M485 262 L485 288" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="250" y="290" width="180" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text class="th" x="340" y="312" font-size="13" fill="#633806" text-anchor="middle" dominant-baseline="central">人工锁定研究版本</text>

    <path d="M340 334 L340 360" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="80" y="362" width="520" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text class="th" x="340" y="382" font-size="13" fill="#0C447C" text-anchor="middle" dominant-baseline="central">AI-Agent 因子挖掘（ai_rd 模型，×N 轮）</text>
    <text class="ts" x="340" y="400" font-size="11" fill="#185FA5" text-anchor="middle" dominant-baseline="central">提出假设 → 编码因子(CoSTEER) → 回测 → AI 评审采纳为新 SOTA</text>
    <text class="ts" x="340" y="416" font-size="11" fill="#185FA5" text-anchor="middle" dominant-baseline="central">注入防泄漏上下文（测试期前数据）；runner 监控预算</text>

    <path d="M340 426 L340 452" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="80" y="454" width="230" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text class="th" x="195" y="472" font-size="13" fill="#444441" text-anchor="middle" dominant-baseline="central">可信度验证（无 LLM）</text>
    <text class="ts" x="195" y="490" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">复现·tie 种子×10·holdout·安慰剂×20</text>
    <rect x="370" y="454" width="230" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text class="th" x="485" y="472" font-size="13" fill="#444441" text-anchor="middle" dominant-baseline="central">规则重判定（verdict）</text>
    <text class="ts" x="485" y="490" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">预注册可证伪测试 + 迁移分类</text>

    <path d="M195 510 L195 536" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M485 510 L485 536" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="80" y="538" width="520" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text class="th" x="340" y="558" font-size="13" fill="#0C447C" text-anchor="middle" dominant-baseline="central">研究迭代 Agent（loop 状态机，预算 $2 / 5 轮）</text>
    <text class="ts" x="340" y="576" font-size="11" fill="#185FA5" text-anchor="middle" dominant-baseline="central">OBSERVE → DIAGNOSE → PLAN(可辩论) → GATE(人工) → ACT(子任务) → EVALUATE</text>
    <text class="ts" x="340" y="592" font-size="11" fill="#185FA5" text-anchor="middle" dominant-baseline="central">事实包不含测试期数值；连续 2 轮无改进即停并回流线索</text>

    <path d="M600 538 C640 510, 640 430, 600 404" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
    <text class="ts" x="612" y="470" font-size="11" fill="#185FA5">新一轮</text>

    <path d="M340 602 L340 624" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="52" y="626" width="130" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text class="th" x="117" y="648" font-size="13" fill="#444441" text-anchor="middle" dominant-baseline="central">组合构建/合成</text>
    <rect x="206" y="626" width="106" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text class="th" x="259" y="648" font-size="13" fill="#633806" text-anchor="middle" dominant-baseline="central">人工审批</text>
    <rect x="336" y="626" width="106" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text class="th" x="389" y="648" font-size="13" fill="#444441" text-anchor="middle" dominant-baseline="central">模拟盘</text>
    <rect x="466" y="626" width="150" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text class="th" x="541" y="648" font-size="13" fill="#444441" text-anchor="middle" dominant-baseline="central">监控预警（规则）</text>
    <path d="M182 648 L202 648" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M312 648 L332 648" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M442 648 L462 648" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

    <path d="M616 626 C660 560, 660 120, 632 80" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
    <text class="ts" x="648" y="360" font-size="11" fill="#5F5E5A">预警回流</text>
    <text class="ts" x="648" y="376" font-size="11" fill="#5F5E5A">成新线索</text>
  </g>
</svg>
