# 本地开发差异：挂载源码，修改代码后无需重建镜像
services:
  app:
    volumes:
      - .:/workspace

  # RD-Agent 各市场配置模板（本地开发挂载；云端部署时打包进镜像）
  # RD-Agent 扩展代码（factopia.mining.rdagent_ext）通过 PYTHONPATH 加载
  rdagent:
    environment:
      PYTHONPATH: /workspace/factopia
    volumes:
      - ./configs:/workspace/configs:ro
      - ./factopia:/workspace/factopia/factopia:ro
  rdagent-ui:
    volumes:
      - ./configs:/workspace/configs:ro
  rdagent-web:
    environment:
      PYTHONPATH: /workspace/factopia
    volumes:
      - ./configs:/workspace/configs:ro
      - ./factopia:/workspace/factopia/factopia:ro

  # 后台运行器与回测导出：挂载源码（云端部署时打包进镜像）
  runner:
    volumes:
      - ./configs:/workspace/configs:ro
      - ./factopia:/workspace/factopia/factopia:ro
    # 长桥行情 WS：容器内直连该域名遭遇 DNS 污染 + TLS 层 SNI 阻断，且 SDK 不支持代理。
    # 把域名固定解析到本容器 127.0.0.1，由 factopia.longport_fwd 转发器经 Clash
    # （host.docker.internal:7897）的 CONNECT 隧道转发到真实端点；TLS 由 SDK 端到端完成。
    # 仅本地 override：云端 compose.cloud.yml 不加此项（海外直连本就通）。
    # 行情再断时先确认宿主机 Clash 是否常开。
    extra_hosts:
      - "openapi-quote.longportapp.com:127.0.0.1"
    command: ["sh", "-c", "while true; do python -m factopia.longport_fwd; sleep 5; done & exec python -m factopia.runner"]
  exporter:
    volumes:
      - .:/workspace

  # 后端接口：挂载源码并自动重载
  api:
    volumes:
      - ./factopia:/workspace/factopia/factopia:ro
      - ./configs:/workspace/configs:ro
    command: ["uvicorn", "factopia.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload",
              "--reload-dir", "/workspace/factopia/factopia"]

  # 前端开发服务器（热更新）：docker compose -f docker-compose.yml -f compose.local.yml --profile dev up -d web-dev
  #   → http://localhost:5173 ；依赖装在命名卷中，避免与宿主机的系统架构混用
  web-dev:
    image: node:22-slim
    profiles: ["dev"]
    working_dir: /app
    depends_on: [api]
    environment:
      API_UPSTREAM: http://api:8000
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    command: ["sh", "-c", "npm ci && npm run dev"]

volumes:
  web_node_modules:
